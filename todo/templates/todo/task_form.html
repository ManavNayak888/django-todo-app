{% extends 'todo/base.html' %}
{% block content %}
  <h2>{% if object %}Update{% else %}Create{% endif %} Task</h2>

  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <div class="text-danger small">{{ field.errors }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
{% endblock %}
