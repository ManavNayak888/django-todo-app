<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container py-4">

  <header class="mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="text-primary">To-Do App</h1>
      <div>
        {% if user.is_authenticated %}
          <span class="me-2">Hello, <strong>{{ user.username }}</strong></span>
          <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-sm btn-outline-primary me-2">Login</a>
          <a href="{% url 'signup' %}" class="btn btn-sm btn-outline-success">Sign Up</a>
        {% endif %}
      </div>
    </div>
    <hr>
  </header>

  <main>
    {% if messages %}
      <div id="flash-messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} fade show" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Auto-dismiss flash messages after 3 seconds -->
  <script>
    setTimeout(function () {
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(function (alert) {
        const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
        bsAlert.close();
      });
    }, 3000);
  </script>

</body>
</html>
